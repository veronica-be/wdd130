<!DOCTYPE html>

<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Whitewater Rafting Company</title>
    <meta name="description"
      content="Contact with us and ask for any information or reserve with us. Great Adventures Awaits You!.">
    <meta name="author" content="Veronica Becerra Estrada">


</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Logo of the whitewater rafting site">
        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>
    <main>


        <article class="adventure serve">
            <h1>Whitewater Rafting Corporation</h1>
            <p>Plaça Catarina Albert, 25560 Sort, Lleida</p>
            <p>Lleida, Spain</p>
            <p>+34 973 621 462</p>
            <p>info@whitewater.com</p>
        </article>
        <div class="map_form_contact">
            <div>
                <iframe class="map"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2945.676120364918!2d1.1288151812796954!3d42.413341321136244!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a605dec692e217%3A0x59af785b36b4b182!2sLa%20Rafting%20Company!5e0!3m2!1ses-419!2ses!4v1770360586998!5m2!1ses-419!2ses"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>

            </div>


            <form class="form grid">
                <h2>Info Request</h2>

                <label for="name">NAME</label>
                <input type="text" id="name" name="name" placeholder="Type here" required>


                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" placeholder="example@email.com"
                  required>


                <p>MESSAGE PURPOSE</p>
                <div class="grid">
                    <div>
                        <input type="radio" id="general" name="purpose" value="" required>

                        <label for="general">General Inquiry</label>
                    </div>

                    <div><input type="radio" id="reservation" name="purpose"
                          value="Reservation Question">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div>
                        <input type="radio" id="suggestion" name="purpose"
                          value="Website Suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>
                <label for="message">MESSAGE</label>
                <textarea class="grid_column_span" id="message" name="message"
                  placeholder="Type here" required></textarea>
                <div class="grid_column_span">
                    <input type="checkbox" id="suscribe" name="suscribe">
                    <label for="suscribe">Subscribe me to the monthly newsletter</label>
                </div>

                <button class="grid_column_span button" type="submit">Get in Touch!</button>

            </form>


        </div>


        <section class="adventure serve">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/employee_2.jpg" alt="Employee 2_Sofia Martinez">
                    <figcaption>
                        <span>Sofia Martinez</span>
                        <span>Customer Support & Assistance</span>
                        <span>"Here to answer all your questions"</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee_1.jpg" alt="Employee 1_Daniel Brooks">
                    <figcaption>
                        <span>Daniel Brooks</span>
                        <span>Guest Safety Specialist</span>
                        <span>"Your safety is my priority"</span>
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee_3.jpg" alt="Employee 3_Lily Harper">
                    <figcaption>
                        <span>Lily Harper</span>
                        <span>Adventure Coordinator</span>
                        <span>"I'll help you plan the perfect trip"</span>
                    </figcaption>
                </figure>
            </div>
        </section>


    </main>
    <footer>
        <p>&copy;2026 &#10070; Whitewater Rafting &#10070; Veronica Becerra</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook Icon"></a>
            <a href="https://youtube.com"><img src="images/youtube.png" alt="Youtube Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.png"
                  alt="Instagram Icon"></a>
        </nav>

    </footer>
</body>

</html>
