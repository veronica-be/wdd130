<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<header>
</header>

<body>

    <h1>Basic HTML and CSS Quiz</h1>
    <form>
        <label for="q1">What does the acronym CSS stand for?</label>
        <input type="text" id="q1" name="q1" required>


        <label for="q2">How are id and class atributes selected in CSS?</label>
        <textarea id="q2" name="q2" required></textarea>
        <label for="q3">Which of the following is a valid CSS comment?</label>
        <select id="q3" name="q3" required>
            <option value="" selected disabled>Choose One...</option>
            <option value="#Comment">#Comment</option>
            <option value="--Comment">--Comment</option>
            <option value="'''Comment'''">'''Comment'''</option>
            <option value="/*Comment*/">/*Comment*/</option>
            <option value="*/Comment/*">*/Comment/*</option>
            <!--Hola jejeje-->
        </select>
        <label for="q4">What is the bottom margin given by this declaration: "margin: 10px 5px
            15px;"</label>
        <input type="number" id="q4" name="q4" required>

        <button type="submit">Submit Quiz</button>
    </form>

</body>
